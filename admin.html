<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FBF8F7">
<title>Dossiers reçus — Comptarapide</title>
<link rel="icon" href="logo-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

.abar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.abar-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.abar .sp{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.badge.zero{background:var(--surface-2);color:var(--muted)}

.awrap{max-width:1280px;margin:0 auto;padding:24px 16px 80px}
.login{max-width:390px;margin:8vh auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
.login h1{font-size:21px;margin-bottom:5px}
.login p{font-size:13.4px;color:var(--muted);margin-bottom:18px}
.login .f{margin-bottom:13px}
.login .btn{width:100%;margin-top:6px}
.loginerr{font-size:12.8px;color:var(--accent-ink);font-weight:600;margin-top:11px;display:none}
.loginerr.on{display:block}

.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.filt{border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
.filt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.search{flex:1;min-width:170px;padding:8px 13px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px}

.dtable{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.drow{display:grid;grid-template-columns:14px minmax(0,2.1fr) minmax(0,1.5fr) 96px 84px 110px 92px;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit}
.drow:first-child{border-top:0}
.drow:hover{background:var(--surface-2)}
.drow .unread{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.drow.read{opacity:.72}
.drow.read .unread{background:transparent}
.drow .t1{font-weight:700;font-size:14.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow.read .t1{font-weight:500}
.drow .t2{font-size:12.4px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .cel{font-size:12.8px;color:var(--ink-2);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .head{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.drow.hdr{cursor:default;background:var(--surface-2)}
.drow.hdr:hover{background:var(--surface-2)}
@media (max-width:860px){
  .drow{grid-template-columns:14px minmax(0,1fr) auto;gap:10px}
  .drow .hide-s{display:none}
}
.stat{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.stat.nouveau{background:var(--accent-soft);color:var(--accent-ink)}
.stat.en_cours{background:var(--warn-soft);color:var(--warn)}
.stat.traite{background:var(--ok-soft);color:var(--ok)}

.empty{text-align:center;padding:56px 20px;color:var(--muted);font-size:14px}

.sheet{position:fixed;inset:0;z-index:70;display:none}
.sheet.on{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(20,14,13,.5)}
.sheet-in{position:absolute;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--ground);border-left:1px solid var(--line);overflow-y:auto;box-shadow:-12px 0 40px -20px rgba(0,0,0,.5)}
.sheet-h{position:sticky;top:0;background:color-mix(in srgb,var(--ground) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:12px;align-items:center;z-index:2;flex-wrap:wrap}
.sheet-h h2{font-size:18px;flex:1;min-width:150px}
.sheet-b{padding:18px}
.ref{font-family:"Public Sans",monospace;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--accent-ink);background:var(--accent-soft);padding:3px 9px;border-radius:6px}

.phgrid{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
.ph{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.ph a{display:block;aspect-ratio:4/3;background:var(--surface-2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap2{padding:7px 9px;font-size:11.5px;color:var(--ink-2);line-height:1.35}
.ph .ld{display:grid;place-items:center;height:100%;font-size:11.5px;color:var(--muted)}

.acts{display:flex;gap:8px;flex-wrap:wrap}
.notes{width:100%;min-height:84px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;resize:vertical}
</style>
</head>
<body>

<div id="login-view">
  <div class="login">
    <img src="logo-light.png" alt="Comptarapide" style="height:26px;margin-bottom:18px">
    <h1>Dossiers reçus</h1>
    <p>Espace réservé. Connectez-vous avec le compte administrateur créé dans Supabase.</p>
    <div class="f"><label for="em">E-mail</label><input type="email" id="em" autocomplete="username"></div>
    <div class="f"><label for="pw">Mot de passe</label><input type="password" id="pw" autocomplete="current-password"></div>
    <button class="btn prim" id="go" type="button">Se connecter</button>
    <div class="loginerr" id="lerr"></div>
  </div>
</div>

<div id="app-view" hidden>
  <div class="abar">
    <div class="abar-in">
      <img class="logo logo-light" src="logo-light.png" alt="Comptarapide" style="height:24px">
      <img class="logo logo-dark" src="logo-dark.png" alt="Comptarapide" style="height:24px">
      <span class="badge zero" id="badge">0 non lu</span>
      <div class="sp"></div>
      <button class="btn sec" id="reload" type="button">Actualiser</button>
      <button class="btn sec" id="out" type="button">Déconnexion</button>
    </div>
  </div>
  <div class="awrap">
    <div class="filters">
      <button class="filt" data-f="tous" aria-pressed="true" type="button">Tous</button>
      <button class="filt" data-f="nonlus" aria-pressed="false" type="button">Non lus</button>
      <button class="filt" data-f="nouveau" aria-pressed="false" type="button">Nouveaux</button>
      <button class="filt" data-f="en_cours" aria-pressed="false" type="button">En cours</button>
      <button class="filt" data-f="traite" aria-pressed="false" type="button">Traités</button>
      <input class="search" id="q" type="search" placeholder="Rechercher une société, un nom, une référence…">
    </div>
    <div id="list"></div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-bg" id="sheetbg"></div>
  <div class="sheet-in">
    <div class="sheet-h">
      <h2 id="sh-title">—</h2>
      <span class="ref" id="sh-ref"></span>
      <button class="btn sec" id="sh-close" type="button">Fermer</button>
    </div>
    <div class="sheet-b" id="sh-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
